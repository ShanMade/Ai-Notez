name: Temporary NotezAi source-panel checks

on:
  push:
    branches:
      - notez-ai-source-panel

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check app/01-config-and-core.js
          node --check app/03-library-and-folders.js
          node --check app/04-reader-and-html.js
          node --check app/06-ai-and-recording.js
          node --check app/07-voice-profiles.js
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend test dependencies
        working-directory: backend
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install -r requirements.txt pytest httpx
      - name: Run backend API tests
        working-directory: backend
        run: /tmp/v/bin/python -m pytest -q tests/test_backend.py
