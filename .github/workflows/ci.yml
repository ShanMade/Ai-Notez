name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generated files are up to date
        run: node scripts/generate.mjs --check
      - name: Syntax-check every frontend module
        run: |
          for file in app/*.js sw.js; do node --check "$file"; done
      - name: Shared intent parity (browser side)
        run: node --test scripts/intent-parity.test.mjs

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    env:
      NOTEZ_DATA_DIR: ${{ runner.temp }}/notez-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
        working-directory: backend
      - name: Run tests
        run: python -m pytest -q
        working-directory: backend
