name: Deploy Everything

on:
  push:
    branches: [ main ]

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AI_NOTEZ }}
          projectId: ai-notez

  deploy-backend:
    runs-on: ubuntu-latest
    needs: deploy-frontend  # Wait for frontend first
    steps:
      - uses: actions/checkout@v4
      - run: cd backend && pip install -r requirements.txt
      - run: cd backend && fastapi deploy --project your-project
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          AI_GEMINI_API_KEY: ${{ secrets.AI_GEMINI_API_KEY }}
