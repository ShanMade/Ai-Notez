[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "notez-backend"
version = "1.0.0"
requires-python = "==3.12.*"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.fastapi]
entrypoint = "app.main:app"
